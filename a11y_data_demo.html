<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form and Data Accessibility Test</title>
</head>
<body>

    <h1>Data & Form Violations</h1>

    <!-- VIOLATION 1: Relying purely on color to convey information (WCAG 1.4.1) -->
    <!-- Colorblind users cannot differentiate error fields without icon or text alerts -->
    <p>Please fix the fields highlighted in red:</p>
    <input type="text" style="border: 2px solid red;" value="Invalid entry">

    <!-- VIOLATION 2: Data table missing structural headers (WCAG 1.3.1) -->
    <!-- Screen readers cannot associate data cells with their respective columns -->
    <table border="1">
        <tr>
            <td>Name</td>
            <td>Role</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>Admin</td>
        </tr>
    </table>

    <!-- VIOLATION 3: Duplicate ID attributes on a page (WCAG 4.1.1 / Section 508) -->
    <!-- Breaks form label associations and confuses assistive screen mapping tools -->
    <label for="user-input">First Name</label>
    <input type="text" id="user-input">

    <label for="user-input">Last Name</label>
    <input type="text" id="user-input">

</body>
</html>
